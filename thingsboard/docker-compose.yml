services:
  postgres:
    restart: always
    image: "postgres:18"
    ports:
      - "5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  thingsboard-ce:
    restart: always
    image: "thingsboard/tb-node:4.3.1.6"
    ports:
      - "127.0.0.1:5433:5432"
      - "8080:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # default: postgres; kind: reachable from pods in the kind cluster as thingsboard-ce.
    networks: [default, kind]

volumes:
  postgres-data:
    name: tb-postgres-data
    driver: local

networks:
  # Created by `kind create cluster`; compose only attaches to it.
  kind:
    external: true