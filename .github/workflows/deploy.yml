# Production dbt build on every push to main. The only place target prod runs.
# Secrets: DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DBT_ENV_SECRET_DATABRICKS_TOKEN.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never stop a prod build halfway

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
      UV_NO_SYNC: "1" # keep the dbt-only env that uv sync built
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --locked --only-group dbt
      - run: uv run dbt deps --project-dir dbt --profiles-dir dbt --target prod
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt --target prod
      # dbt-ci compares PRs against this manifest (state:modified+, --defer).
      - name: Upload prod-manifest
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: dbt/target/manifest.json
          retention-days: 90
