name: telemetry_lakehouse
version: "1.0.0"
profile: telemetry_lakehouse
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  # stg_telemetry re-reads this many days of _ingested_at on every incremental run.
  stg_lookback_days: 3
  # Plausible range for the TH sensors; readings outside it are flagged as outliers.
  outlier_temperature_min: -40
  outlier_temperature_max: 85
  # A device counts as offline after this many minutes without data (cadence is 30 s).
  offline_after_minutes: 10
  # Tests: a silence longer than this is reported as a gap (severity warn).
  max_gap_minutes: 120

# Custom schemas apply outside dev only; see macros/generate_schema_name.sql.
models:
  telemetry_lakehouse:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

snapshots:
  telemetry_lakehouse:
    +schema: silver

seeds:
  telemetry_lakehouse:
    +schema: silver
    devices:
      +column_types:
        device_id: string
        site: string
        model: string
        latitude: double
        longitude: double
