# Hourly dbt build against the dev target, 10 minutes after the bronze job (minute 5).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-build
  labels:
    app.kubernetes.io/name: dbt-build
spec:
  schedule: "15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: dbt-build
    spec:
      backoffLimit: 1
      # Under the hourly period, so a hung run cannot block the next one (Forbid).
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dbt-build
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dbt
              image: dbt-runner
              args: ["build", "--target", "dev"]
              # DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DBT_ENV_SECRET_DATABRICKS_TOKEN.
              envFrom:
                - secretRef:
                    name: databricks-dbt
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # dbt writes only target/, logs/ and temp files.
              volumeMounts:
                - name: dbt-target
                  mountPath: /app/dbt/target
                - name: dbt-logs
                  mountPath: /app/dbt/logs
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: dbt-target
              emptyDir: {}
            - name: dbt-logs
              emptyDir: {}
            - name: tmp
              emptyDir: {}
